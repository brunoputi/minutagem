name: Atualizar minutagem

on:
  schedule:
    - cron: "0 9 * * *"   # todo dia às 06:00 de Brasília
  workflow_dispatch:       # botão "Run workflow" e disparo pelo painel ao salvar posições

permissions:
  contents: write

concurrency:
  group: minutagem
  cancel-in-progress: false

jobs:
  atualizar:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependências
        run: pip install requests

      - name: Coletar dados do ESPN
        run: python coletor/coletar.py

      - name: Salvar no repositório
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          for tentativa in 1 2 3; do
            git add docs/data posicoes.csv cache
            if git diff --staged --quiet; then echo "Nada novo"; break; fi
            git commit -m "Atualiza minutagem $(date -u +%F)"
            if git push; then break; fi
            echo "Alguém salvou no meio do caminho; refazendo com a versão mais nova"
            git fetch origin main
            git reset --hard origin/main
            python coletor/coletar.py
          done
