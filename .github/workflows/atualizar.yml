name: Atualizar minutagem

on:
  schedule:
    - cron: "0 9 * * *"   # todo dia às 06:00 de Brasília
  workflow_dispatch:       # botão "Run workflow" para rodar na hora

permissions:
  contents: write

concurrency:
  group: minutagem
  cancel-in-progress: false

jobs:
  atualizar:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependências
        run: pip install requests

      - name: Coletar dados do ESPN
        run: python coletor/coletar.py

      - name: Salvar no repositório
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add docs/data posicoes.csv cache
          git diff --staged --quiet || git commit -m "Atualiza minutagem $(date -u +%F)"
          git push
