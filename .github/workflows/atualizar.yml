name: Atualizar minutagem

on:
  schedule:
    # 4 coletas por dia, fora da hora cheia (o GitHub atrasa ou pula execuções marcadas em :00)
    - cron: "17 4 * * *"    # 01:17 de Brasília: pega os jogos da noite
    - cron: "17 10 * * *"   # 07:17 de Brasília: confirma a coleta da madrugada
    - cron: "17 16 * * *"   # 13:17 de Brasília: jogos da manhã e correções do ESPN
    - cron: "47 22 * * *"   # 19:47 de Brasília: jogos da tarde
  workflow_dispatch:       # botão "Run workflow" e disparo pelo painel ao salvar posições

permissions:
  contents: write

concurrency:
  group: minutagem
  cancel-in-progress: false

jobs:
  atualizar:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependências
        run: pip install requests

      - name: Coletar dados do ESPN
        run: python coletor/coletar.py

      - name: Salvar no repositório
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          for tentativa in 1 2 3; do
            git add docs/data posicoes.csv cache
            if git diff --staged --quiet; then echo "Nada novo"; break; fi
            git commit -m "Atualiza minutagem $(date -u +%F)"
            if git push; then break; fi
            echo "Alguém salvou no meio do caminho; refazendo com a versão mais nova"
            git fetch origin main
            git reset --hard origin/main
            python coletor/coletar.py
          done
